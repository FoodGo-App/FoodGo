# Standalone: never import application.properties or local secrets.
spring.application.name=foodgo-m01-test
server.port=0
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
server.error.include-message=never
foodgo.seed-enabled=false
foodgo.cors-origins=http://localhost:8081

foodgo.rich-seed-enabled=false
foodgo.rich-seed-exit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.properties.hibernate.query.native.prefer_jdbc_datetime_types=true
