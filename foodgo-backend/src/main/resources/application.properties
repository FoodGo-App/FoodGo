spring.application.name=foodgo-backend
spring.config.import=optional:file:./application-local.properties
server.port=${FOODGO_PORT:8080}
spring.datasource.url=${FOODGO_DB_URL:jdbc:mariadb://127.0.0.1:3306/fooddriver}
spring.datasource.username=${FOODGO_DB_USERNAME:root}
spring.datasource.password=${FOODGO_DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.native.prefer_jdbc_datetime_types=true
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
server.error.include-message=never
foodgo.seed-enabled=${FOODGO_SEED_ENABLED:false}
foodgo.seed-password=${FOODGO_SEED_PASSWORD:FoodGo@123}
foodgo.wallet-scenario=${FOODGO_WALLET_SCENARIO:SUCCEEDED}
foodgo.call-scenario=${FOODGO_CALL_SCENARIO:CONNECTED}
foodgo.offer-seconds=${FOODGO_OFFER_SECONDS:30}
foodgo.quote-seconds=${FOODGO_QUOTE_SECONDS:120}
foodgo.cors-origins=${FOODGO_CORS_ORIGINS:http://localhost:8081,http://localhost:8082,http://localhost:8083,http://127.0.0.1:8081}

foodgo.rich-seed-enabled=${FOODGO_RICH_SEED_ENABLED:false}
foodgo.rich-seed-exit=${FOODGO_RICH_SEED_EXIT:false}
